[phases.setup]
nixPkgs = ["python311", "libGL", "glib"]

[phases.install]
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install numpy==1.26.4 ml_dtypes==0.2.0 && pip install -r requirements.txt && pip install opencv-python-headless==4.8.1.78 --force-reinstall"
]

[start]
cmd = "python app.py"