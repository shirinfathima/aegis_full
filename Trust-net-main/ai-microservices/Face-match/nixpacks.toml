[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python -m ensurepip",
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt",
  "python -m pip uninstall -y opencv-python",
  "python -m pip install opencv-python-headless==4.8.1.78"
]

[start]
cmd = "python app.py"